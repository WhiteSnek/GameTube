<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>WebSocket Chat Test</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: #1e1e1e;
      color: white;
      width: 700px;
      margin: 40px auto;
    }

    input,
    button {
      padding: 10px;
      font-size: 14px;
    }

    button {
      cursor: pointer;
    }

    #messages {
      margin-top: 20px;
      border: 1px solid #444;
      background: #111;
      height: 400px;
      overflow-y: auto;
      padding: 10px;
    }

    .msg {
      margin-bottom: 12px;
      padding: 8px;
      border-radius: 6px;
      background: #2b2b2b;
    }

    .system {
      color: #5dc9ff;
    }

    .error {
      color: red;
    }

    .controls {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }

    #message {
      flex: 1;
    }
  </style>
</head>

<body>

<h2>WebSocket Chat Test</h2>

<div class="controls">
  <input id="userId" value="user-1" placeholder="User ID">
  <input id="guildId" value="guild-1" placeholder="Guild ID">
  <button id="connect">Connect</button>
</div>

<div id="messages"></div>

<div class="controls">
  <input
    id="message"
    placeholder="Type message..."
    autocomplete="off"
  />

  <button id="send">Send</button>
</div>

<script>
let socket;

const messages = document.getElementById("messages");

function addMessage(text, cls = "") {
  const div = document.createElement("div");
  div.className = "msg " + cls;
  div.innerText = text;

  messages.appendChild(div);
  messages.scrollTop = messages.scrollHeight;
}

document.getElementById("connect").onclick = () => {
  const guildId = document.getElementById("guildId").value;
  const userId = document.getElementById("userId").value;

  const token = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJleHAiOjE3ODU3NzUzNDAsImd1aWxkSWQiOiI1YTJhNDk4MS1mOTM2LTQ2ZjEtYmQzZS01YTBjN2QwNmY4NmUiLCJpYXQiOjE3ODU3NzQ0NDAsInJvbGUiOiJMRUFERVIiLCJ1c2VySWQiOiJjMWUzNWE3Zi0wMmIzLTRlOWItOTNiYS03N2ZhYjkwOGUyNjYifQ.dMuGf4PGP6SruXEos_g2wBCUkJqIuRtZpmTG3Xu66Us";

  socket = new WebSocket(
    `ws://localhost:8080?token=${token}`
  );

  socket.onopen = () => {
    addMessage(`Connected as ${userId}`, "system");
  };

  socket.onmessage = (event) => {
    const data = JSON.parse(event.data);
    addMessage(JSON.stringify(data, null, 2));
  };

  socket.onclose = () => {
    addMessage("Disconnected", "system");
  };

  socket.onerror = () => {
    addMessage("Socket Error", "error");
  };
};

document.getElementById("send").onclick = () => {

  if (!socket) return;

  socket.send(JSON.stringify({
    action: "sendMessage",
    message: document.getElementById("message").value
  }));

  document.getElementById("message").value = "";
};

document.getElementById("message").addEventListener("keydown", e => {

  if (e.key === "Enter") {
    document.getElementById("send").click();
  }

});
</script>

</body>
</html>
